[project]
name = "team-agent-harness"
version = "0.1.0"
description = "MVP backend for a team-oriented multi-agent harness."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "openai>=2.0",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.34",
  "websockets>=15.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.setuptools.packages.find]
include = ["app*"]
